[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-insight"
version = "0.1.0"
description = "Normalize e-commerce CSV exports and generate sales reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "streamlit>=1.28.0", "openpyxl>=3.1.0", "schedule>=1.2.0", "flask>=3.0.0", "plotly>=5.18.0"]

[project.scripts]
sales-insight = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
